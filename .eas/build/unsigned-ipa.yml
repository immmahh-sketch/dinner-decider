# Custom EAS Build workflow: produce an UNSIGNED .ipa for Signulous to re-sign.
# No Apple Developer credentials are used at build time.
#
#   eas build --platform ios --profile unsigned-ipa
#
# If the archive step fails on the scheme, check the build logs for the real
# scheme name and hard-code SCHEME= below.

build:
  name: Unsigned IPA (for Signulous)
  steps:
    - eas/checkout
    - eas/install_node_modules
    - eas/prebuild:
        inputs:
          clean: true
    - run:
        name: Archive without code signing
        working_directory: ios
        command: |
          set -eux
          WORKSPACE="$(ls -d *.xcworkspace | head -n1)"
          SCHEME="$(xcodebuild -workspace "$WORKSPACE" -list 2>/dev/null \
            | awk '/Schemes:/{flag=1; next} flag && NF {gsub(/^[ \t]+/,""); print; exit}')"
          echo "Using workspace=$WORKSPACE scheme=$SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/DinnerDecider.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES
    - run:
        name: Repackage .app into an unsigned .ipa
        working_directory: ios
        command: |
          set -eux
          cd build
          mkdir -p Payload
          cp -R DinnerDecider.xcarchive/Products/Applications/*.app Payload/
          rm -f DinnerDecider-unsigned.ipa
          zip -qry DinnerDecider-unsigned.ipa Payload
          ls -la DinnerDecider-unsigned.ipa
    - eas/upload_artifact:
        name: Upload the unsigned .ipa
        inputs:
          type: application-archive
          path: ios/build/DinnerDecider-unsigned.ipa
