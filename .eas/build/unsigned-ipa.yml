# Custom EAS Build workflow: produce an UNSIGNED .ipa.
#
# Why: Signulous re-signs the app with its own certificate, so we do not need
# Apple Developer credentials at build time. A normal `eas build -p ios` refuses
# to run without credentials; this workflow disables code signing and repackages
# the .app into an .ipa by hand.
#
# Run with:  eas build --platform ios --profile unsigned-ipa
#
# You will likely need to tweak the `scheme` below to match the Xcode scheme
# generated by prebuild (it is usually the app name with no spaces:
# "DinnerDecider"). Check the EAS build logs if the archive step fails.

build:
  name: Unsigned IPA (for Signulous)
  steps:
    - eas/checkout
    - eas/use_npm_token
    - eas/install_node_modules
    - eas/prebuild:
        inputs:
          clean: true
          platform: ios
    - name: Archive without code signing
      working_directory: ios
      command: |
        set -eux
        SCHEME="DinnerDecider"
        WORKSPACE="$(ls -d *.xcworkspace | head -n1)"
        xcodebuild \
          -workspace "$WORKSPACE" \
          -scheme "$SCHEME" \
          -configuration Release \
          -sdk iphoneos \
          -archivePath "$PWD/build/DinnerDecider.xcarchive" \
          archive \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          PROVISIONING_PROFILE_SPECIFIER=""
    - name: Repackage .app into an unsigned .ipa
      working_directory: ios
      command: |
        set -eux
        cd build
        mkdir -p Payload
        cp -R DinnerDecider.xcarchive/Products/Applications/*.app Payload/
        rm -f DinnerDecider-unsigned.ipa
        zip -qry DinnerDecider-unsigned.ipa Payload
        ls -la DinnerDecider-unsigned.ipa
    - name: Upload the .ipa as the build artifact
      uses: eas/upload_artifact
      with:
        type: application-archive
        path: ios/build/DinnerDecider-unsigned.ipa
