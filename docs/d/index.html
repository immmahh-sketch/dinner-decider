<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Open in Dinner Decider</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #eef2f6; color: #10202b; padding: 24px;
  }
  @media (prefers-color-scheme: dark) { body { background: #0f1a20; color: #e7eef2; } .card { background: #16242c !important; } }
  .card {
    background: #fff; border-radius: 20px; padding: 32px; max-width: 420px; width: 100%;
    box-shadow: 0 12px 40px rgba(0,0,0,0.12); text-align: center;
  }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  p { font-size: 15px; line-height: 1.5; opacity: 0.8; }
  .btn {
    display: inline-block; margin-top: 10px; padding: 13px 22px; border-radius: 999px;
    background: #0fb5a6; color: #fff; font-weight: 800; text-decoration: none; font-size: 15px;
  }
  .ghost { background: transparent; color: #0fb5a6; border: 1.5px solid #0fb5a6; }
  .emoji { font-size: 44px; }
  .row { display: flex; gap: 10px; flex-direction: column; align-items: center; }
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">🍽️</div>
    <h1 id="title">Opening your dinner idea…</h1>
    <p id="msg">If nothing happens, you don’t have the app yet.</p>
    <div class="row">
      <a class="btn" id="open" href="#">Open in the app</a>
      <a class="btn ghost" href="https://apps.apple.com/app/id6809964712">Get Dinner Decider</a>
    </div>
  </div>
<script>
  (function () {
    var id = new URLSearchParams(location.search).get('x');
    var deepLink = id ? 'dinnerdecider://dish/' + encodeURIComponent(id) : 'dinnerdecider://';
    document.getElementById('open').setAttribute('href', deepLink);

    if (!id) {
      document.getElementById('title').textContent = 'Dinner Decider';
      document.getElementById('msg').textContent = 'Pick tonight’s dinner in seconds.';
      return;
    }

    var bounced = false;
    var t = setTimeout(function () {
      if (bounced) return;
      document.getElementById('title').textContent = 'Get Dinner Decider';
      document.getElementById('msg').textContent =
        'Install the app, then tap this link again to jump straight to the recipe.';
    }, 1600);
    window.addEventListener('pagehide', function () { bounced = true; clearTimeout(t); });
    window.addEventListener('blur', function () { bounced = true; clearTimeout(t); });

    // try to hand off to the app
    location.href = deepLink;
  })();
</script>
</body>
</html>
