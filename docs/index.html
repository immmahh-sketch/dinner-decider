<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dinner Decider</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #eef2f6; color: #10202b; padding: 24px;
  }
  @media (prefers-color-scheme: dark) { body { background: #0f1a20; color: #e7eef2; } .card { background: #16242c !important; } }
  .card {
    background: #fff; border-radius: 20px; padding: 32px; max-width: 420px; width: 100%;
    box-shadow: 0 12px 40px rgba(0,0,0,0.12); text-align: center;
  }
  h1 { font-size: 26px; margin: 8px 0 4px; }
  p { font-size: 15px; line-height: 1.5; opacity: 0.8; }
  .btn {
    display: inline-block; margin-top: 16px; padding: 13px 22px; border-radius: 999px;
    background: #0fb5a6; color: #fff; font-weight: 800; text-decoration: none; font-size: 15px;
  }
  .emoji { font-size: 44px; }
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">🍽️</div>
    <h1>Dinner Decider</h1>
    <p>Can’t decide what’s for dinner? Answer a few quick questions and get a shortlist — home cooking, takeaway or eating out.</p>
    <a class="btn" href="https://apps.apple.com/app/id6809964712">Get the app</a>
  </div>
</body>
</html>
